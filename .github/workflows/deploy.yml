
name: Deploy Customer Churn Prediction to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd ~/Customer-Churn-Prediction

            echo "Pulling latest GitHub code..."
            git pull origin main

            echo "Rebuilding Docker image..."
            sudo docker build -t customer-churn-app:latest .

            echo "Stopping old container..."
            sudo docker rm -f customer-churn-app || true

            echo "Starting updated application..."
            sudo docker run -d \
              --name customer-churn-app \
              --restart unless-stopped \
              -p 8000:8000 \
              customer-churn-app:latest

            echo "Waiting for application startup..."
            sleep 20

            echo "Checking application health..."
            curl --fail --retry 5 --retry-delay 5 \
              http://localhost:8000/health
