```yaml
name: Deploy Customer Churn Prediction to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout GitHub repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Verify AWS Role Secret
      - name: Check AWS Role ARN
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_ARN secret is missing"
            exit 1
          fi

          echo "AWS_ROLE_ARN secret is configured"

      # Step 3: Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GitHubActionsDeployment

      # Step 4: Verify AWS authentication
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # Step 5: Deploy application to EC2 using SSM
      - name: Deploy application to EC2
        id: deploy
        shell: bash
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04b25870c245216f1" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Customer Churn Prediction" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/Customer-Churn-Prediction",
              "git pull origin main",
              "sudo docker build -t customer-churn-app:latest .",
              "sudo docker rm -f customer-churn-app || true",
              "sudo docker run -d --name customer-churn-app --restart unless-stopped -p 8000:8000 customer-churn-app:latest",
              "sleep 30",
              "curl --fail http://localhost:8000/health"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "Deployment Command ID: $COMMAND_ID"

      # Step 6: Wait for EC2 deployment
      - name: Wait for deployment completion
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-04b25870c245216f1"

      # Step 7: Display deployment logs
      - name: Display deployment logs
        if: always()
        run: |

          if [ -n "${{ steps.deploy.outputs.command_id }}" ]; then

            aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.command_id }}" \
              --instance-id "i-04b25870c245216f1" \
              --output json || true

          fi
```
