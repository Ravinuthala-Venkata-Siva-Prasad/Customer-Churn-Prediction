
name: Deploy Customer Churn Prediction to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy application through AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04b25870c245216f1" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Customer Churn Prediction" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/Customer-Churn-Prediction",
              "git pull origin main",
              "sudo docker build -t customer-churn-app:latest .",
              "sudo docker rm -f customer-churn-app || true",
              "sudo docker run -d --name customer-churn-app --restart unless-stopped -p 8000:8000 customer-churn-app:latest",
              "sleep 20",
              "curl --fail http://localhost:8000/health"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04b25870c245216f1"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04b25870c245216f1" \
            --output json
